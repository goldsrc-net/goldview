name: CI

on:
  # Branch pushes only: a vX.Y.Z tag runs release.yml, which calls this workflow.
  push:
    branches: ['**']
  pull_request:
  # release.yml checks a tagged commit through this workflow before building it.
  workflow_call:

jobs:
  checks:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
