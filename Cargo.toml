[workspace]
resolver = "2"
members = ["crates/formats", "crates/vfs", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/goldsrc-net/goldview"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1"
anyhow = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "tga", "bmp"] }
